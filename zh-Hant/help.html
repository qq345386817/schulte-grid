  <main class="article">
    <p class="kicker">說明</p><h1>使用舒爾特方格</h1><p class="lead">選擇方格難度，依序找到數字，查看用時，然後繼續下一輪練習。</p>
    <section><h2>開始計時練習</h2><p>進入舒爾特方格頁面，選擇合適的難度，然後從 1 開始依序點擊數字。完成後可以查看本輪用時。</p></section>
    <section><h2>選擇方格難度</h2><p>3x3 和 4x4 適合熱身，5x5 是經典練習，6x6 更適合進階視覺搜尋訓練。</p></section>
    <section><h2>列印練習紙</h2><p>使用列印功能生成離線練習紙，適合課堂、家庭、辦公室或螢幕外練習。</p></section>
    <section><h2>查看歷史記錄</h2><p>完成練習後，最近記錄會保存在本地裝置上，方便觀察自己的練習變化。</p></section>
