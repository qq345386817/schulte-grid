  <main class="article">
    <p class="kicker">帮助</p><h1>使用舒尔特方格</h1><p class="lead">选择方格难度，按顺序找到数字，查看用时，然后继续下一轮练习。</p>
    <section><h2>开始计时练习</h2><p>进入舒尔特方格页面，选择合适的难度，然后从 1 开始按顺序点击数字。完成后可以查看本轮用时。</p></section>
    <section><h2>选择方格难度</h2><p>3x3 和 4x4 适合热身，5x5 是经典练习，6x6 更适合进阶视觉搜索训练。</p></section>
    <section><h2>打印练习纸</h2><p>使用打印功能生成离线练习纸，适合课堂、家庭、办公室或屏幕外练习。</p></section>
    <section><h2>查看历史记录</h2><p>完成练习后，最近记录会保存在本地设备上，方便观察自己的练习变化。</p></section>
